# Optional: run PostgreSQL in Docker instead of installing it on your machine.
#   docker compose up -d
# Connection string: postgres://postgres:postgres@localhost:5432/revenue_dashboard
services:
  postgres:
    image: postgres:16-alpine
    container_name: revenue-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revenue_dashboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
